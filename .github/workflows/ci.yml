name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: mvn -B verify
      - name: Run the packaged command
        run: |
          scripts/keystore put target/ci-store city Boston
          scripts/keystore flush target/ci-store
          test "$(scripts/keystore get target/ci-store city)" = Boston
          scripts/keystore delete target/ci-store city
          scripts/keystore flush target/ci-store
          scripts/keystore compact target/ci-store
          if scripts/keystore get target/ci-store city; then exit 1; fi
          scripts/keystore dump target/ci-store
      - name: Replicate between two packaged servers
        run: scripts/replication-demo.sh
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.os }}
          path: target/surefire-reports/
