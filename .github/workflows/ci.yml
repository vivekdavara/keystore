name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Pinned, so a release's run is on the images earlier runs used (ubuntu-latest and macos-latest gave
        # these to day 1's first run, one on day 2 and day 4's last); ubuntu-latest moves to 26.04 from Oct 19, 2026.
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: mvn -B verify
      - name: Run the packaged command
        run: scripts/smoke.sh
      - name: Replicate between two packaged servers
        run: scripts/replication-demo.sh
      - name: JMH benchmarks, one short iteration each (a smoke run, not a measurement)
        run: scripts/jmh.sh -f 1 -wi 0 -i 1 -r 100ms
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.os }}
          path: target/surefire-reports/
